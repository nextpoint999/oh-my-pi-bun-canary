# =============================================================================
# omp 镜像发布 workflow
#
# 定时(每 6 小时)检查上游 can1357/oh-my-pi 的新 release；发现新 tag 就用该 tag
# 源码 + 最新 bun canary 构建全部 7 个平台二进制，发布到本仓库
# （发布 tag 与上游保持一致，如 v17.2.9）。
#
# 说明:
#   * 每次运行最多处理 3 个新版本（release 不频繁，后续轮询自动补齐遗漏版本）
#   * 原生模块直接取官方 npm leaf（免 bazel 交叉编译），运行时从 bun canary
#     tag 注入（canary 不做 npm 发布，详见 scripts/build-omp-release.sh 头注释）
#   * 本仓库需开启 Actions；发布用的 GITHUB_TOKEN 自动授权（contents: write）
# =============================================================================
name: Mirror omp releases

on:
  schedule:
    # UTC 每 6 小时（GitHub cron 使用 UTC）
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "可选：指定上游 tag 强制构建（如 v17.2.9）"
        required: false
        type: string
      targets:
        description: "可选：构建目标，逗号分隔；默认 all（7 个平台）"
        required: false
        default: all
        type: string

permissions:
  contents: write

concurrency:
  group: omp-mirror
  cancel-in-progress: false

jobs:
  mirror:
    name: 检测并镜像 omp release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: 安装 bun canary
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: 计算待镜像的上游版本
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          UPSTREAM="can1357/oh-my-pi"
          if [ -n "${{ inputs.tag }}" ]; then
            TAGS="${{ inputs.tag }}"
          else
            TAGS="$(gh api "repos/${UPSTREAM}/releases?per_page=30" --jq '.[].tag_name')"
          fi
          # 本仓库已发布的版本（发布 tag 与上游同名，如 v17.2.9）
          MIRRORED="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name' 2>/dev/null || true)"
          NEW=""
          for t in $TAGS; do
            if printf '%s\n' "$MIRRORED" | grep -qx "${t}"; then
              echo "已镜像: ${t}，跳过"
            else
              NEW="$NEW $t"
            fi
          done
          # 每轮最多处理 3 个新版本，避免单轮超时；遗漏的由后续轮询补齐
          NEW="$(echo "$NEW" | tr ' ' '\n' | sed '/^$/d' | head -3)"
          if [ -z "$NEW" ]; then
            echo "没有新的上游版本需要构建"
          fi
          echo "new_tags=${NEW}" >> "$GITHUB_OUTPUT"

      - name: 构建并发布新版本
        if: ${{ steps.versions.outputs.new_tags != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAGS: ${{ steps.versions.outputs.new_tags }}
        run: |
          set -euo pipefail
          for tag in $NEW_TAGS; do
            echo "===== 构建上游 ${tag} ====="
            bash scripts/build-omp-release.sh "$tag" "${{ inputs.targets }}"
          done
